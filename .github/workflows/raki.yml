name: Raki - desempacotar zip e gerar IPA

# Como usar: suba um arquivo chamado project.zip na raiz do repositório.
# O workflow extrai os arquivos nos lugares certos, remove o zip, e gera o IPA (sem assinatura).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.zip']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desempacotar project.zip
        run: |
          if [ -f project.zip ]; then
            rm -rf /tmp/unz && mkdir /tmp/unz
            unzip -q project.zip -d /tmp/unz
            src=/tmp/unz
            # Se o zip tiver uma única pasta na raiz, entra nela.
            if [ ! -f "$src/project.yml" ]; then
              n=$(find "$src" -mindepth 1 -maxdepth 1 -not -name '__MACOSX' | wc -l | tr -d ' ')
              d=$(find "$src" -mindepth 1 -maxdepth 1 -type d -not -name '__MACOSX' | head -1)
              if [ "$n" = "1" ] && [ -n "$d" ]; then src="$d"; fi
            fi
            if [ ! -f "$src/project.yml" ]; then
              echo "::error::project.yml não encontrado dentro do zip"
              exit 1
            fi
            # .github fica de fora: o token do Actions não pode alterar workflows.
            (cd "$src" && tar cf - --exclude=.github --exclude=__MACOSX --exclude=.DS_Store .) | tar xf -
            git rm -q project.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Desempacotar project.zip [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar sem assinatura
        run: |
          xcodebuild -project Raki.xcodeproj -scheme Raki -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Raki.app Payload/
          zip -qry Raki.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Raki-ipa
          path: Raki.ipa

      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Raki.ipa \
            --title "Raki build ${{ github.run_number }}" \
            --notes "IPA sem assinatura. Precisa ser assinado para instalar no iPhone."
